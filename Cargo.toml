[package]
name = "bevy_state_scoped_resources"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "State-scoped resource lifecycle management for Bevy — the resource equivalent of StateScoped"
readme = "README.md"
repository = "https://github.com/peterellisjones/bevy_state_scoped_resources"
keywords = ["bevy", "gamedev", "ecs", "state"]
categories = ["game-development"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_state"] }

[features]
default = []
force_assertions = []
